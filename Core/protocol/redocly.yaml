extends:
  - recommended

# All Redocly rules stay at recommended defaults. Targeted exceptions for
# intentionally-unused schemas (e.g. PreAuthChallengeResponse — returned by
# the host's login endpoint, not by any Omni2FA endpoint) live in the
# sibling file `.redocly.lint-ignore.yaml`, which is generated by:
#   npx redocly lint --generate-ignore-file --config Core/protocol/redocly.yaml \
#       Core/protocol/omni2fa.openapi.yaml
# Re-run that command when adding a new intentional exception. Do NOT add a
# global "rule: off" here — exceptions must be reviewed per-component.
